name: Patch admin assignment UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-admin-assignment.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminDashboardPage.jsx')
          s = p.read_text()
          s = s.replace("const statuses = ['new', 'under_review', 'contacted', 'quotation_sent', 'won', 'lost', 'closed']", "const statuses = ['new', 'under_review', 'approved', 'contacted', 'quotation_sent', 'won', 'lost', 'closed']")
          s = s.replace("  const canAssignQuotes = ['super_admin', 'admin', 'quote_manager'].includes(role)\n", "  const canAssignQuotes = ['super_admin', 'admin', 'quote_manager'].includes(role)\n  const canApproveQuotes = ['super_admin', 'admin'].includes(role)\n")
          marker = "  const assignQuote = async (quoteId, assignedTo) => {"
          approve = '''  const approveQuote = async (quoteId) => {\n    const previous = quotes.find((quote) => quote.id === quoteId)\n    if (!previous || previous.status === 'approved') return\n    setBusyAction(`approve:${quoteId}`)\n    setError('')\n    try {\n      const data = await callQuoteFunction({ action: 'approve', quoteId })\n      setQuotes((items) => items.map((item) => item.id === quoteId ? { ...item, ...data.quote } : item))\n      setNotice('Enquiry approved.')\n      await loadAuditLogs(role)\n    } catch (approvalError) {\n      setError(approvalError.message)\n    } finally {\n      setBusyAction('')\n    }\n  }\n\n'''
          if 'const approveQuote = async' not in s:
              s = s.replace(marker, approve + marker)
          control = '''                    {canAssignQuotes && (\n                      <label><span>Assigned to</span><select disabled={busyAction === `assign:${quote.id}`} value={quote.assigned_to || ''} onChange={(event) => assignQuote(quote.id, event.target.value)}><option value="">Unassigned</option>{quoteAssignees.map((user) => <option key={user.id} value={user.id}>{user.full_name}</option>)}</select></label>\n                    )}\n'''
          replacement = control + '''                    {canApproveQuotes && quote.status !== 'approved' && (\n                      <button className="ops-primary" type="button" disabled={busyAction === `approve:${quote.id}`} onClick={() => approveQuote(quote.id)}>Approve</button>\n                    )}\n'''
          if 'onClick={() => approveQuote(quote.id)}' not in s:
              s = s.replace(control, replacement)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminDashboardPage.jsx
          git diff --cached --quiet || git commit -m "feat: add assignment-aware approval UI"
          git push
