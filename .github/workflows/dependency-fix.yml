name: One-Time Dependency Fix

on:
  push:
    branches:
      - go-live-hardening-20260908

permissions:
  contents: write

jobs:
  patch-router:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: go-live-hardening-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade patched React Router release
        run: npm install react-router-dom@7.18.3
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit generated manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: patch React Router security advisory"
          git push origin HEAD:go-live-hardening-20260908
