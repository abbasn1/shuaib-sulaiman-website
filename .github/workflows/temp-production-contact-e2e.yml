name: Temporary Production Domain Probe

on:
  push:
    branches:
      - go-live-seo-audit-20260909
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe likely Cloudflare Pages hostnames
        shell: bash
        run: |
          set +e
          for host in \
            shuaib-sulaiman-website.pages.dev \
            shuaib-sulaiman.pages.dev \
            shuaib-sulaiman-co.pages.dev \
            shuaib-sulaiman-company.pages.dev \
            shuaibsulaiman.pages.dev \
            shuaibsulaimanco.pages.dev; do
            echo "=== $host ==="
            getent hosts "$host" || true
            curl --connect-timeout 5 --max-time 10 --silent --show-error --location --head "https://$host/" | head -n 12 || true
          done
          exit 0
