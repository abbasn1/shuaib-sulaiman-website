name: Apply content editor patch

on:
  push:
    branches:
      - grand-prompt-content-editor-20260909

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grand-prompt-content-editor-20260909
      - name: Apply role patch
        run: python scripts/apply_content_editor_patch.py
      - name: Remove one-shot patch files
        run: rm scripts/apply_content_editor_patch.py .github/workflows/content-editor-patch.yml
      - name: Commit patched application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: restore least-privilege content editor"
          git push origin HEAD:grand-prompt-content-editor-20260909
